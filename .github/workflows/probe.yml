name: Air Busan Page Diagnostic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect booking page
        run: |
          cat > airbusan_check.py <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.on("request", lambda r: print(
                  "REQUEST:", r.method, r.url.split("?")[0]
              ))

              page.on("response", lambda r: print(
                  "RESPONSE:", r.status, r.url.split("?")[0]
              ))

              try:
                  page.goto(
                      "https://www.airbusan.com/web/individual/booking/flightsAvail",
                      wait_until="networkidle",
                      timeout=60000
                  )

                  print("PAGE TITLE:", page.title())
                  print("PAGE URL:", page.url)
                  print("PAGE TEXT:")
                  print(page.locator("body").inner_text()[:5000])

              except Exception as e:
                  print("ERROR:", str(e))

              finally:
                  browser.close()
          PY

          python airbusan_check.py
